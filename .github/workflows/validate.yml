name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python deploy/compile_translations.py
      - run: python manage.py test tests --noinput
        env:
          KEYBOARDED_DEV: '1'
      - run: sh -n install.sh
      - run: python deploy/package_release.py
